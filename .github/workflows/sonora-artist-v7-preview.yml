name: Sonora Artist V7 Preview

on:
  push:
    branches: [feat/sonora-artist-album-neutral]
    paths: [.github/workflows/sonora-artist-v7-preview.yml]

permissions:
  contents: write

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out exact V7 commit
        uses: actions/checkout@v6
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Test artist module
        run: |
          chmod +x gradlew
          ./gradlew :feature:search:testDebugUnitTest --no-daemon
      - name: Compile Android debug APK
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Verify identity, signature, digest
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name aapt | sort -V | tail -n1)
          SIGNER=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name apksigner | sort -V | tail -n1)
          test -x "$AAPT"
          test -x "$SIGNER"
          "$AAPT" dump badging "$APK" | grep '^package: ' | tee "$RUNNER_TEMP/package.txt"
          grep -Fq "name='com.stash.app.debug' versionCode='157' versionName='0.9.121-sonora-artist-v7'" "$RUNNER_TEMP/package.txt"
          "$SIGNER" verify "$APK"
          sha256sum "$APK"
      - name: Publish exact verified APK as prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=sonora-artist-v7-20261030
          APK="$RUNNER_TEMP/Sonora-Artista-V7-v0.9.121.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          test -s "$APK"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::V7 tag already exists; refusing to overwrite release"
            exit 1
          fi
          DIGEST=$(sha256sum "$APK" | cut -d' ' -f1)
          cat > "$RUNNER_TEMP/notes.md" <<'EOF'
          # Sonora Artista V7 — prévia para comparar no Redmi

          **Versão Android:** 0.9.121-sonora-artist-v7 (157); **pacote:** com.stash.app.debug.
          **Escopo:** exclusivamente a página de artista.

          - Hero mais longo, com transição contínua da fotografia ao conteúdo.
          - Play sozinho e nome central, com respiro inferior maior.
          - Card de álbum destacado mais baixo, translúcido e discreto.
          - Seção Mais ouvidas com espaço editorial e proporções de texto/miniatura específicas do perfil.
          - Classificador de cor V6 preservado (fundo contido, sem cor fixa por artista).
          - Mini-player, navegação, página de álbum, reprodução e download preservados.

          **Prévia, não versão visualmente aprovada.** Comparar no Redmi Note 14 com a referência Apple-like; conferir foto, card, listagem, botões e funcionamento.
          A seleção de fotos e logos depende dos fornecedores atuais. Nenhum merge no PR #2.
          Se houver erro de assinatura, não desinstale a versão anterior sem avaliar perda de dados.
          EOF
          printf '\nSHA-256: `%s`\nCommit compilado: `%s`\n' "$DIGEST" "$GITHUB_SHA" >> "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Sonora Artista V7 — layout editorial 0.9.121" --notes-file "$RUNNER_TEMP/notes.md" --prerelease --latest=false
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,assets --jq '{url:.url,assets:[.assets[].name]}'
