name: Sonora V18 — Transparent Status Bar

on:
  push:
    branches:
      - feat/sonora-v18-transparent-statusbar
    paths:
      - .github/workflows/sonora-v18-statusbar.yml
      - app/build.gradle.kts
      - app/src/main/kotlin/com/stash/app/MainActivity.kt
      - app/src/main/kotlin/com/stash/app/navigation/StashScaffold.kt
      - feature/nowplaying/src/main/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-preview:
    name: Compile, sign and publish Android preview
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout V18
        uses: actions/checkout@v6

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test and assemble APK
        env:
          FANART_API_KEY: ${{ secrets.FANART_API_KEY }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :feature:nowplaying:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Verify package, signature and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name aapt | sort -V | tail -n1)
          SIGNER=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name apksigner | sort -V | tail -n1)
          "$AAPT" dump badging "$APK" | grep '^package:' | tee "$RUNNER_TEMP/package.txt"
          grep -Fq "name='com.stash.app.debug' versionCode='169' versionName='0.9.133-sonora-statusbar'" "$RUNNER_TEMP/package.txt"
          "$SIGNER" verify "$APK"
          sha256sum "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: sonora-v18-statusbar-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish installable GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=sonora-v18-transparent-statusbar-20261031
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release already exists; refusing to overwrite it"
            exit 1
          fi
          APK="$RUNNER_TEMP/Sonora-V18-Barra-Transparente-v0.9.133-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          # Sonora V18 — Barra de status transparente

          - Remove a faixa cinza/azulada atrás de relógio, bateria e sinal.
          - Home: grafite contínuo sob a barra do Android.
          - Player musical: fundo ambiente da capa estendido atrás do relógio, com controles respeitando a área segura.
          - Demais telas: fundo visual contínuo até a borda superior; podcast mantém os insets de seus controles.
          - Mantém as mudanças da V17.1 em datas e recomendações.
          - APK Debug (pacote com.stash.app.debug), assinado com a chave de teste do projeto.

          Testar em dispositivo físico, especialmente Android 16/MIUI, orientações horizontal e vertical, temas claro/escuro e player expandido. Não é release de produção.
          EOF
          printf '\nCommit: `%s`\nSHA-256: `%s`\n' "$GITHUB_SHA" "$SHA" >> "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Sonora V18 — Barra de status transparente" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --prerelease --latest=false
