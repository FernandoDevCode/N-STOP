name: Sonora V22.2 — Photographic Hero U Fade

on:
  push:
    branches:
      - fix/sonora-v22-2-photo-hero-u-fade
    paths:
      - .github/workflows/sonora-v22-2-photo-hero.yml
      - core/data/src/main/kotlin/com/stash/core/data/artistphotos/**
      - core/data/src/test/kotlin/com/stash/core/data/artistphotos/**
      - feature/search/src/main/**
      - feature/search/src/test/**
      - feature/home/src/main/**
      - app/build.gradle.kts
      - app/src/main/kotlin/com/stash/app/MainActivity.kt
      - app/src/main/kotlin/com/stash/app/navigation/StashScaffold.kt
      - feature/nowplaying/src/main/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-preview:
    name: Compile, sign and publish Android preview
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout V22.2
        uses: actions/checkout@v6

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test and assemble APK
        env:
          FANART_API_KEY: ${{ secrets.FANART_API_KEY }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :core:data:testDebugUnitTest :feature:search:testDebugUnitTest :feature:nowplaying:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Verify package, signature and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name aapt | sort -V | tail -n1)
          SIGNER=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name apksigner | sort -V | tail -n1)
          "$AAPT" dump badging "$APK" | grep '^package:' | tee "$RUNNER_TEMP/package.txt"
          grep -Fq "name='com.stash.app.debug' versionCode='177' versionName='0.9.141-sonora-photo-u-fade'" "$RUNNER_TEMP/package.txt"
          "$SIGNER" verify "$APK"
          sha256sum "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: sonora-v22-2-photo-hero-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish installable GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=sonora-v22-2-photo-u-fade-20261101
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release already exists; refusing to overwrite it"
            exit 1
          fi
          APK="$RUNNER_TEMP/Sonora-V22-2-Fotos-Fade-U-v0.9.141-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          # Sonora V22.2 — Fotografias icônicas e fade em U

          - O hero principal mostra APENAS fotografias, nunca logos/símbolos.
          - Fotografias representativas verificadas via MusicBrainz/Wikidata P18 têm primeira prioridade; seleção original por formação/datas/rating continua como fallback intacto.
          - O wordmark continua apenas como elemento sobreposto; a promoção para foto principal foi removida.
          - A fotografia usa Fit sem Crop, com altura calculada pela proporção real. Se o arquivo já vier cortado da fonte, o app não inventa conteúdo ausente.
          - Fade inferior suave no formato U, mais alto nas laterais e mais baixo no centro, sem múltiplos scrims verticais empilhados.
          - Cache anterior de seleção icônica substituído sem limpar dados do usuário.
          - Inclui as correções anteriores da barra superior e do aplicativo.
          - Pré-release Debug para Android, não produção.

          Validação: core:data e feature:search (seleção photo-only, fallback e geometria do U), feature:nowplaying, build do app, verificação de assinatura.
          A foto exata servida ao Slipknot no aparelho não foi capturada remotamente; não atribuir um corte pré-existente à fonte sem comparação da URL efetiva.
          EOF
          printf '\nCommit: `%s`\nSHA-256: `%s`\n' "$GITHUB_SHA" "$SHA" >> "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Sonora V22.2 — Fotografias icônicas e fade em U" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --prerelease --latest=false
