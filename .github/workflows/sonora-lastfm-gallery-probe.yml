name: Sonora Lastfm Gallery Probe Temporary
on:
  push:
    branches: [research/sonora-lastfm-gallery-probe]
permissions:
  contents: read
  issues: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests beautifulsoup4
      - run: python tools/research/probe_lastfm_gallery.py
      - name: Report to isolated PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=50" --jq '[.[] | select(.head.ref == "research/sonora-lastfm-gallery-probe") | .number] | first')
          if [ -n "$PR" ] && [ -f lastfm-report.md ]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --raw-field "body=$(cat lastfm-report.md)"
          fi
