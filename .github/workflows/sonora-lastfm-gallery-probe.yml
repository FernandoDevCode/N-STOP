name: Sonora Lastfm Gallery Probe Temporary
on:
  push:
    branches: [research/sonora-lastfm-gallery-probe]
permissions:
  contents: write
  issues: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests beautifulsoup4
      - run: python tools/research/probe_lastfm_gallery.py
      - name: Archive probe results on temporary branch
        if: always()
        run: |
          if [ -f lastfm-report.md ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f lastfm-report.md
            git commit -m "research: archive Lastfm probe results [skip ci]" || true
            git push
          fi
