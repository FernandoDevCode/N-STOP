name: Sonora - APK experimental (branches PR)

on:
  workflow_dispatch:
  push:
    branches:
      - 'refactor/**'
      - 'feat/**'
      - 'fix/**'

permissions:
  contents: write

concurrency:
  group: sonora-experimental-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.ref != 'refs/heads/nonstop' &&
      (github.event_name == 'workflow_dispatch' ||
       contains(github.event.head_commit.message, '[publish sonora experimental]'))
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify launcher files
        run: python3 tools/verify_sonora_launcher.py

      - name: Run tests and build candidate APK
        env:
          FANART_API_KEY: ${{ secrets.FANART_API_KEY }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Verify APK package and signature
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name aapt | sort -V | tail -n1)
          SIGNER=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name apksigner | sort -V | tail -n1)
          test -n "$AAPT" && test -n "$SIGNER"
          BADGING=$("$AAPT" dump badging "$APK" | grep '^package:')
          [[ "$BADGING" == *"name='com.stash.app.debug'"* ]] || { echo "::error::Unexpected applicationId"; exit 1; }
          "$SIGNER" verify "$APK"
          echo "$BADGING"

      - name: Publish immutable experimental prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHORT_SHA=${GITHUB_SHA:0:12}
          TAG="sonora-exp-${SHORT_SHA}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Experimental release already exists for this exact SHA"
            exit 1
          fi
          APK="$RUNNER_TEMP/Sonora-Experimental-${SHORT_SHA}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          SHA256=$(sha256sum "$APK" | cut -d' ' -f1)
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          SONORA APK EXPERIMENTAL - NAO E A VERSAO CANONICA.

          - Branch de origem: ${GITHUB_REF_NAME}
          - Commit exato: ${GITHUB_SHA}
          - SHA-256: ${SHA256}
          - Pacote Debug: com.stash.app.debug
          - Testes automatizados e assinatura verificados antes desta publicacao.
          - Objetivo: validacao no aparelho antes do merge. O escopo de cada teste e o de seu respectivo PR.
          - Consulte a branch e o PR para identificar as alteracoes deste APK.
          - Nao desinstalar a versao instalada. Se houver conflito de assinatura, nao forcar substituicao.
          - A publicacao do APK experimental NAO significa merge na nonstop nem aprovacao visual.
          EOF
          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Sonora EXPERIMENTAL - ${GITHUB_REF_NAME} - ${SHORT_SHA}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --prerelease --latest=false
