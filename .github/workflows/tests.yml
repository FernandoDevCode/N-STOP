name: Unit tests

# Runs JVM unit tests on push and PR. The repo previously had no test CI —
# only release.yml, which builds the APK on `v*` tags. This validates the
# media module (playback resume, queue, streaming) on every change and also
# builds a debug APK artifact for manual on-device testing.

on:
  push:
    paths-ignore: ['web/**']
  pull_request:
    paths-ignore: ['web/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Compiles the unit-test source set of EVERY module. This is the gate the
  # repo was missing: `unit-tests` below runs only :core:media, and
  # `assembleDebug` compiles main sources only — so a test that no longer
  # compiles (e.g. a ViewModel gaining a constructor param without its test
  # being updated, PR #305) produced ZERO CI signal and shipped through five
  # releases. This job catches that class on every push/PR. No `[skip test]`
  # hatch: a compile break must never be skippable. Fast (no test execution),
  # zero flakiness.
  compile-tests:
    name: Compile all unit tests
    if: >-
      github.event_name != 'push' ||
      github.ref == 'refs/heads/master' ||
      contains(github.event.head_commit.message, '[do test]')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Fix gradlew permission
        run: chmod +x gradlew

      # `--continue` for the same reason as the unit-tests job: a compile error
      # in one module otherwise hides every other module's.
      - name: Compile every module's unit tests
        run: ./gradlew compileDebugUnitTestKotlin --continue --no-daemon

  # The share Worker's tests (mixes, rooms, Community), then the sync Worker, tip jar, lossless relay and Last.fm proxy.
  # They import only local files, so no npm install.
  worker-tests:
    name: Share worker tests
    if: >-
      github.event_name != 'push' ||
      github.ref == 'refs/heads/master' ||
      contains(github.event.head_commit.message, '[do test]')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run the Worker's tests
        working-directory: infra/share-worker
        run: node --no-warnings --test test/*.test.js

      # The sync Worker (linking with Stash on the web): pairing, spaces, limits, retention. node:sqlite stands in for
      # the Durable Objects' SQLite; local imports only.
      - name: Run the sync Worker's tests
        working-directory: infra/sync-worker
        run: node --no-warnings --test test/*.test.js

      # The tip jar (supporters list, Ko-fi webhook, stashfm.app early access). Local imports only too.
      - name: Run the tip jar's tests
        working-directory: infra/tipjar-worker
        run: node --no-warnings --test test/*.test.js

      # The lossless relay (Qobuz mint, quotas, account rotation): the most abuse-sensitive Worker, so its suite
      # must not only run by hand. node:sqlite stands in for D1; local imports only.
      - name: Run the lossless relay's tests
        working-directory: infra/lossless-relay
        run: node --no-warnings --test test/*.test.js

      # The Last.fm proxy (param allowlist, canonical cache key, per-network miss limit). Local imports only.
      - name: Run the Last.fm proxy's tests
        working-directory: infra/lastfm-proxy
        run: node --no-warnings --test test/*.test.js

  # Keep the full Android test coverage, but shard independent Gradle tasks.
  # A single cold runner repeatedly reached the 20-minute safety cap before
  # Gradle finished the entire repository. Each shard retains that cap and
  # reports failures independently; none of the 20 modules is skipped.
  unit-tests:
    name: All module unit tests (shard ${{ matrix.shard }})
    if: >-
      github.event_name != 'push' ||
      github.ref == 'refs/heads/master' ||
      contains(github.event.head_commit.message, '[do test]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: foundations
            tasks: ':core:art:testDebugUnitTest :core:common:testDebugUnitTest :core:model:testDebugUnitTest :core:auth:testDebugUnitTest :core:network:testDebugUnitTest :core:ui:testDebugUnitTest'
          - shard: catalogs
            tasks: ':data:spotify:testDebugUnitTest :data:ytmusic:testDebugUnitTest :data:lyrics:testDebugUnitTest :data:download:testDebugUnitTest'
          - shard: engine
            tasks: ':core:data:testDebugUnitTest :core:media:testDebugUnitTest :app:testDebugUnitTest'
          - shard: features
            tasks: ':feature:community:testDebugUnitTest :feature:home:testDebugUnitTest :feature:library:testDebugUnitTest :feature:nowplaying:testDebugUnitTest :feature:search:testDebugUnitTest :feature:settings:testDebugUnitTest :feature:sync:testDebugUnitTest'
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Fix gradlew permission
        run: chmod +x gradlew

      - name: Run shard unit tests
        env:
          GRADLE_TEST_TASKS: ${{ matrix.tasks }}
        run: ./gradlew $GRADLE_TEST_TASKS --continue --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-results-${{ matrix.shard }}
          path: |
            **/build/test-results/testDebugUnitTest/
            **/build/reports/tests/testDebugUnitTest/

  build-debug-apk:
    if: >-
      github.event_name != 'push' ||
      (github.ref == 'refs/heads/master' && !contains(github.event.head_commit.message, '[skip test]')) ||
      (github.ref != 'refs/heads/master' && contains(github.event.head_commit.message, '[do test]'))
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Fix gradlew permission
        run: chmod +x gradlew

      - name: Verify Sonora launcher PNG integrity
        run: python3 tools/verify_sonora_launcher.py

      - name: Assemble debug APK
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Locate debug APK
        id: find_apk
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n1)
          if [ -z "$APK" ]; then
            echo "::error::No debug APK produced by assembleDebug"
            exit 1
          fi
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "Built: $APK ($(du -h "$APK" | cut -f1))"

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: stash-debug-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
