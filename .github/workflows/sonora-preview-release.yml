name: Publish Sonora Artist & Album Preview

on:
  push:
    branches:
      - feat/sonora-artist-album-neutral
    paths:
      - .github/workflows/sonora-preview-release.yml

permissions:
  contents: write
  actions: read

jobs:
  publish-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Download exact Android debug build from PR #2
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sonora-preview"
          gh run download 40910318843 --repo "$GITHUB_REPOSITORY" --name stash-debug-apk --dir "$RUNNER_TEMP/sonora-preview"
          test -f "$RUNNER_TEMP/sonora-preview/app-debug.apk"
          printf '%s  %s\n' 'c60e4d348a1100594ef3443e015e679729fb41a75406def5e220f5b2b48e3447' "$RUNNER_TEMP/sonora-preview/app-debug.apk" | sha256sum -c -
          cp "$RUNNER_TEMP/sonora-preview/app-debug.apk" "$RUNNER_TEMP/sonora-preview/Sonora-Artista-Album-PREVIEW.apk"
      - name: Publish isolated prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/sonora-preview/release-notes.md" <<'EOF'
          ## Sonora — prévia visual (não é versão estável)

          Teste do redesign das páginas de artista e álbum, com controles branco-frio, superfícies grafite e abas editoriais. Baseada no PR #2.

          **Pacote Android:** `com.stash.app.debug`, versão `0.9.115` (`151`). Instala separadamente da edição release `com.stash.app`. Se já houver uma Debug, precisa ser assinada com a mesma chave para atualizar.

          **Atenção:** o APK compilou, mas a suíte completa não ficou verde (falhas isoladas nas duas tentativas do CI). Fidelidade visual e instalação no aparelho ainda não foram validadas. Não use como atualização estável.

          **Build correspondente:** commit `a83022de15fb4912fc81f40b418078afd015f1c6` (10 arquivos de UI no PR). SHA-256 do APK: `c60e4d348a1100594ef3443e015e679729fb41a75406def5e220f5b2b48e3447`.
          EOF
          TAG='sonora-artist-album-preview-20261029'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Preview release already exists; will not overwrite it.'
            exit 0
          fi
          gh release create "$TAG" "$RUNNER_TEMP/sonora-preview/Sonora-Artista-Album-PREVIEW.apk" --repo "$GITHUB_REPOSITORY" --target a83022de15fb4912fc81f40b418078afd015f1c6 --title 'Sonora — Artista e Álbum (preview de teste)' --notes-file "$RUNNER_TEMP/sonora-preview/release-notes.md" --prerelease --latest=false
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url
