name: Sonora Artist V9 — Global Colors Release

on:
  push:
    branches:
      - feat/sonora-artist-adaptive-atmosphere
    paths:
      - .github/workflows/sonora-artist-v9-global-colors.yml

permissions:
  contents: write

jobs:
  build-test-publish:
    name: Test, assemble and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Build and run all Android unit tests
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest :app:assembleDebug --continue --no-daemon

      - name: Verify exact build version and APK signing
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name aapt | sort -V | tail -n1)
          SIGNER=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name apksigner | sort -V | tail -n1)
          test -x "$AAPT" && test -x "$SIGNER"
          "$AAPT" dump badging "$APK" | grep '^package:' | tee "$RUNNER_TEMP/package.txt"
          grep -Fq "name='com.stash.app.debug' versionCode='159' versionName='0.9.123-sonora-artist-v9'" "$RUNNER_TEMP/package.txt"
          "$SIGNER" verify "$APK"
          sha256sum "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: sonora-artist-v9-global-colors-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish signed APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=sonora-artist-v9-global-colors-20261030
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release already exists. Will not overwrite an existing APK."
            exit 1
          fi

          APK="$RUNNER_TEMP/Sonora-Artistas-Cores-Globais-v0.9.123-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          test -s "$APK"
          DIGEST=$(sha256sum "$APK" | cut -d' ' -f1)

          cat > "$RUNNER_TEMP/notes.md" <<'EOF'
          # Sonora — Cores globais refinadas (V9)

          APK Debug: `com.stash.app.debug`, versionCode `159`, versionName `0.9.123-sonora-artist-v9`.

          - Ajuste **global**, sem exceção por artista: vermelho, azul, verde, tons quentes, multicolorido e monocromático.
          - O fundo longo da página agora parte do carvão neutro, com temperatura da fotografia em intensidade sutil.
          - A fotografia permanece intensa; o final da hero vira uma ponte cromática que desaparece gradualmente nos primeiros itens.
          - Transição acompanha a rolagem, em vez de manter uma cor chapada por toda a página.
          - Sem alterações nas imagens e logos selecionados, reprodução, mini-player ou navegação.
          - O botão Play translúcido discutido posteriormente **não está incluído**.

          CI executou testes unitários Android e montou o APK antes de publicar. Ainda é necessário validar visualmente no telefone.
          Não desinstale a versão principal automaticamente em caso de conflito de assinatura.
          EOF
          printf '\nCommit compilado: `%s`\nSHA-256: `%s`\n' "$GITHUB_SHA" "$DIGEST" >> "$RUNNER_TEMP/notes.md"

          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Sonora Artistas V9 — Cores Globais Refinadas" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --prerelease --latest=false
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,assets --jq '{url:.url,assets:[.assets[].name]}'
