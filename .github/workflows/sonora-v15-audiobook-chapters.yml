name: Sonora V15 — YouTube Audiobook Chapter Index

on:
  push:
    branches:
      - feat/sonora-audiobooks-youtube-chapters
    paths:
      - .github/workflows/sonora-v15-audiobook-chapters.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-build-release:
    name: Parse tests, Android Debug, signature and Release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout snapshot
        uses: actions/checkout@v6

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test audiobook import, artist feature and compile APK
        env:
          FANART_API_KEY: ${{ secrets.FANART_API_KEY }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :feature:home:testDebugUnitTest :feature:search:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Verify Debug APK package and signing
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name aapt | sort -V | tail -n1)
          SIGNER=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name apksigner | sort -V | tail -n1)
          "$AAPT" dump badging "$APK" | grep '^package:' | tee "$RUNNER_TEMP/package.txt"
          grep -Fq "name='com.stash.app.debug' versionCode='165' versionName='0.9.129-sonora-v15-audiobook-chapters'" "$RUNNER_TEMP/package.txt"
          "$SIGNER" verify "$APK"
          sha256sum "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: sonora-v15-audiobook-chapter-import-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish V15 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=sonora-v15-audiobook-chapters-20261030
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release already exists; refusing to overwrite it"
            exit 1
          fi
          APK="$RUNNER_TEMP/Sonora-V15-Audiolivros-Capitulos-v0.9.129-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          # Sonora V15 — Importador de capítulos via IA do YouTube

          APK Debug: `com.stash.app.debug` · versionCode 165 · v0.9.129.

          - Aba Audiolivros agora oferece abrir YouTube, copiar prompt, colar resposta, analisar e salvar capítulos.
          - Parsing estrito: horários, sequência sem saltos, sem sobreposição e limites de tamanho.
          - SQLite local, armazenamento por ID de vídeo, recuperação após reinício.
          - Toda resposta é rotulada como **proposta não verificada**; limites estimados não comandam nenhum timer.
          - Sem acesso à API interna do Ask YouTube, Google Account ou download de áudio.
          - Preserva Apple Music como primeira fonte de logos e Play fumê derivado da fotografia.
          - Corrigida tolerância do teste de alpha da V14.

          Ainda NÃO implementa reprodução de audiolivros nem timer por capítulo; este checkpoint é o importador de metadados.

          Valide em dispositivo real antes de promover.
          EOF
          printf '\nCommit: `%s`\nSHA-256: `%s`\n' "$GITHUB_SHA" "$SHA" >> "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Sonora V15 — Capítulos de audiolivros via YouTube" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --prerelease --latest=false
