name: Sonora Lastfm Top5 Gallery Prototype
on:
  push:
    branches:
      - research/sonora-lastfm-top5-preview
    paths:
      - "tools/research/lastfm_top5_preview.py"
      - ".github/workflows/sonora-lastfm-top5-preview.yml"
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests beautifulsoup4 pillow
      - name: Extract top five photo previews
        run: python tools/research/lastfm_top5_preview.py
      - name: Archive HTML and JSON in research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/lastfm-top5-results.json docs/research/lastfm-top5-preview.html
          git commit -m "research: record verified Last.fm top 5 result [skip ci]" || true
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: sonora-lastfm-top5-preview
          path: |
            docs/research/lastfm-top5-results.json
            docs/research/lastfm-top5-preview.html
          retention-days: 14
