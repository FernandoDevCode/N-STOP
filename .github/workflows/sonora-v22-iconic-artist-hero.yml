name: Sonora V22 — Iconic Artist Hero

on:
  push:
    branches:
      - fix/sonora-v22-iconic-artist-hero
    paths:
      - .github/workflows/sonora-v22-iconic-artist-hero.yml
      - core/data/src/main/kotlin/com/stash/core/data/artistphotos/**
      - core/data/src/test/kotlin/com/stash/core/data/artistphotos/**
      - feature/search/src/main/**
      - feature/search/src/test/**
      - feature/home/src/main/**
      - app/build.gradle.kts
      - app/src/main/kotlin/com/stash/app/MainActivity.kt
      - app/src/main/kotlin/com/stash/app/navigation/StashScaffold.kt
      - feature/nowplaying/src/main/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-preview:
    name: Compile, sign and publish Android preview
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout V22
        uses: actions/checkout@v6

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test and assemble APK
        env:
          FANART_API_KEY: ${{ secrets.FANART_API_KEY }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :core:data:testDebugUnitTest :feature:search:testDebugUnitTest :feature:nowplaying:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Verify package, signature and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name aapt | sort -V | tail -n1)
          SIGNER=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name apksigner | sort -V | tail -n1)
          "$AAPT" dump badging "$APK" | grep '^package:' | tee "$RUNNER_TEMP/package.txt"
          grep -Fq "name='com.stash.app.debug' versionCode='175' versionName='0.9.139-sonora-iconic-hero'" "$RUNNER_TEMP/package.txt"
          "$SIGNER" verify "$APK"
          sha256sum "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: sonora-v22-iconic-artist-hero-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish installable GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=sonora-v22-iconic-artist-hero-20261101
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release already exists; refusing to overwrite it"
            exit 1
          fi
          APK="$RUNNER_TEMP/Sonora-V22-Imagem-Iconica-v0.9.139-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          # Sonora V22 — Imagens icônicas efetivas

          - Corrige o vínculo entre a busca por logotipo verificado e a imagem principal do artista.
          - Quando Wikimedia/Fanart não retornam uma imagem icônica, um logotipo oficial do Apple Music ou vinculado com MusicBrainz ao Fanart.tv pode assumir o hero (não apenas aparecer por cima da foto antiga).
          - Identidades e logotipos são exibidos completos e com fundo atmosférico, sem duplicação desfocada.
          - Logo não confiável ou indisponível: mantém a fotografia original como segunda opção.
          - Cache do seletor é atualizado automaticamente para reavaliar escolhas antigas ao instalar.
          - Inclui as correções da barra de status e os demais ajustes anteriores.
          - APK Debug para validação no Android, não release de produção.

          CI executa os testes dos módulos de dados, perfil e player, compilação, verificação de versão e assinatura.
          Confirmar visualmente a escolha real em dispositivo antes da produção.
          EOF
          printf '\nCommit: `%s`\nSHA-256: `%s`\n' "$GITHUB_SHA" "$SHA" >> "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Sonora V22 — Imagens icônicas efetivas" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --prerelease --latest=false
