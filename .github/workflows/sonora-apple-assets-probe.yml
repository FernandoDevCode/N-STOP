name: Sonora Apple Music assets — public page verification
on:
  push:
    branches:
      - research/sonora-apple-artist-assets
    paths:
      - .github/workflows/sonora-apple-assets-probe.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public Apple artist page metadata (no files stored)
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, json, re, html
          endpoints = [
            'https://itunes.apple.com/search?term=Our%20Divide&entity=musicArtist&limit=5',
            'https://music.apple.com/us/artist/our-divide/1605542240',
            'https://music.apple.com/us/artist/metallica/57924',
          ]
          for url in endpoints:
            print('CHECK:',url.split('?')[0])
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; SonoraAssetResearch/1.0)','Accept':'text/html,application/json'})
              with urllib.request.urlopen(req,timeout=15) as resp:
                data=resp.read(2000000).decode('utf-8','replace')
                print('HTTP:',resp.status,'Content:',resp.headers.get('Content-Type'),'Chars:',len(data))
              if url.startswith('https://itunes.'):
                obj=json.loads(data)
                print('Results:',obj.get('resultCount'),[{'artistName':r.get('artistName'),'artistId':r.get('artistId'),'keys':list(r.keys())} for r in obj.get('results',[])[:5]])
              else:
                from html.parser import HTMLParser
                class P(HTMLParser):
                  def __init__(self): super().__init__();self.tags=[]
                  def handle_starttag(self,tag,attrs):
                    if tag in ('meta','script','img','link','source'):
                      a=dict(attrs)
                      key=' '.join([str(a.get('property','')),str(a.get('name','')),str(a.get('type','')),str(a.get('class','')),str(a.get('id',''))]).lower()
                      if ('image' in key or 'logo' in key or 'artwork' in key or 'json' in key or 'og:' in key or tag=='img'):
                        self.tags.append((tag,{k:v[:180] for k,v in a.items() if k in ('property','name','type','content','src','class','id')}))
                p=P();p.feed(data)
                print('META:',p.tags[:22])
                for word in ['logo','artistLogo','wordmark','heroArtwork','artwork','isrc']:
                  print('TOKEN',word,'occurrences',len(re.findall(re.escape(word),data,re.I)))
                  for m in list(re.finditer(re.escape(word),data,re.I))[:2]:
                    print('CONTEXT:',re.sub(r'\s+',' ',data[max(0,m.start()-100):min(len(data),m.end()+170)])[:280])
            except Exception as e:
              print('ERROR:',type(e).__name__,str(e)[:180])
          PY

      - name: Validate publicly embedded Apple artistLogo image
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, json, re
          from urllib.parse import urlparse
          for slug, artist_id in [('our-divide','1605542240'),('billie-eilish','1065981054'),('sabrina-carpenter','390647681')]:
            url=f'https://music.apple.com/us/artist/{slug}/{artist_id}'
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=12) as r:
                html=r.read(400000).decode('utf-8','replace')
              m=re.search(r'"artistLogo":\s*\{',html)
              print('ARTIST',slug,'HTTP ok','logoField',bool(m))
              if not m:continue
              fragment=html[m.start():m.start()+950]
              print('FRAGMENT',fragment[:750].replace('\\u002F','/'))
              fields=re.search(r'"url":"([^"]+)"',fragment)
              if fields:
                logo_url=fields.group(1).replace('\\u002F','/')
                print('LOGO_URL_HOST',urlparse(logo_url).hostname,'image suffix',logo_url[-65:])
                try:
                  with urllib.request.urlopen(urllib.request.Request(logo_url,headers={'User-Agent':'Mozilla/5.0'}),timeout=10) as img:
                    data=img.read(250000)
                    print('IMAGE HTTP',img.status,'content-type',img.headers.get('Content-Type'),'bytes_sample',len(data),'PNG',data.startswith(b'\\x89PNG'))
                except Exception as e:print('IMAGE ERROR',type(e).__name__,str(e)[:100])
            except Exception as e:print('PAGE ERROR',slug,type(e).__name__,str(e)[:150])
          PY

      - name: Verify Apple official artistLogo image URL templates resolve as transparent PNG
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, json, re, struct, zlib
          page='https://music.apple.com/us/artist/our-divide/1605542240'
          with urllib.request.urlopen(urllib.request.Request(page,headers={'User-Agent':'Mozilla/5.0'}),timeout=10) as r:
              html=r.read(500000).decode('utf-8')
          m=re.search(r'"artistLogo":\s*(\{.*?\}),"circleArtwork":',html)
          assert m, 'artistLogo missing'
          logo=json.loads(m.group(1));d=logo['dictionary']
          template=d['url']
          print('Apple logo original dimensions',d['width'],d['height'],'crop',logo['cropStyle'])
          for w in (1600,2886):
              h=round(d['height']*w/d['width'])
              target=template.replace('{w}',str(w)).replace('{h}',str(h)).replace('{c}',logo['cropStyle']).replace('{f}','png')
              try:
                  with urllib.request.urlopen(urllib.request.Request(target,headers={'User-Agent':'Mozilla/5.0'}),timeout=10) as r:
                      content=r.read(500000)
                      ok=content.startswith(b'\\x89PNG')
                      colour_type=content[25] if ok else None
                      print('CANDIDATE',w,h,'status',r.status,'mime',r.headers.get('Content-Type'),'bytes',len(content),'PNG',ok,'colorType',colour_type)
              except Exception as e:print('IMAGE ERROR',w,type(e).__name__,str(e)[:100])
          PY
