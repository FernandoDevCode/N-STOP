name: Sonora Apple Music assets — public page verification
on:
  push:
    branches:
      - research/sonora-apple-artist-assets
    paths:
      - .github/workflows/sonora-apple-assets-probe.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public Apple artist page metadata (no files stored)
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, json, re, html
          endpoints = [
            'https://itunes.apple.com/search?term=Our%20Divide&entity=musicArtist&limit=5',
            'https://music.apple.com/us/artist/our-divide/1605542240',
            'https://music.apple.com/us/artist/metallica/57924',
          ]
          for url in endpoints:
            print('CHECK:',url.split('?')[0])
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; SonoraAssetResearch/1.0)','Accept':'text/html,application/json'})
              with urllib.request.urlopen(req,timeout=15) as resp:
                data=resp.read(2000000).decode('utf-8','replace')
                print('HTTP:',resp.status,'Content:',resp.headers.get('Content-Type'),'Chars:',len(data))
              if url.startswith('https://itunes.'):
                obj=json.loads(data)
                print('Results:',obj.get('resultCount'),[{'artistName':r.get('artistName'),'artistId':r.get('artistId'),'keys':list(r.keys())} for r in obj.get('results',[])[:5]])
              else:
                from html.parser import HTMLParser
                class P(HTMLParser):
                  def __init__(self): super().__init__();self.tags=[]
                  def handle_starttag(self,tag,attrs):
                    if tag in ('meta','script','img','link','source'):
                      a=dict(attrs)
                      key=' '.join([str(a.get('property','')),str(a.get('name','')),str(a.get('type','')),str(a.get('class','')),str(a.get('id',''))]).lower()
                      if ('image' in key or 'logo' in key or 'artwork' in key or 'json' in key or 'og:' in key or tag=='img'):
                        self.tags.append((tag,{k:v[:180] for k,v in a.items() if k in ('property','name','type','content','src','class','id')}))
                p=P();p.feed(data)
                print('META:',p.tags[:22])
                for word in ['logo','artistLogo','wordmark','heroArtwork','artwork','isrc']:
                  print('TOKEN',word,'occurrences',len(re.findall(re.escape(word),data,re.I)))
                  for m in list(re.finditer(re.escape(word),data,re.I))[:2]:
                    print('CONTEXT:',re.sub(r'\s+',' ',data[max(0,m.start()-100):min(len(data),m.end()+170)])[:280])
            except Exception as e:
              print('ERROR:',type(e).__name__,str(e)[:180])
          PY
