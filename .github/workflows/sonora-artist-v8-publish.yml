name: Publish verified Sonora Artist V8

on:
  push:
    branches:
      - codex/sonora-artista-layout
    paths:
      - .github/workflows/sonora-artist-v8-publish.yml

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Verify V8 CI artifact and publish prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: "41105812437"
      SOURCE_COMMIT: "7f8cf8d098d81df7707bfb7240ef5d8b028f40df"
      RELEASE_TAG: "sonora-artist-v8-20261030"
    steps:
      - name: Require verified original build and test compilation
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > "$RUNNER_TEMP/run.json"
          jq -e --arg sha "$SOURCE_COMMIT" '.status=="completed" and .head_sha==$sha' "$RUNNER_TEMP/run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?per_page=100" > "$RUNNER_TEMP/jobs.json"
          for NAME in "Build debug APK" "Compile all unit tests" "Share worker tests"; do
            jq -e --arg name "$NAME" '.jobs | any(.name==$name and .conclusion=="success")' "$RUNNER_TEMP/jobs.json"
          done
          # The original full suite recorded exactly one Robolectric network
          # download failure in core:data. Require evidence, do not claim green.
          jq -e '.jobs | any(.name=="All module unit tests" and .conclusion=="failure")' "$RUNNER_TEMP/jobs.json"
      - name: Confirm sole failure is known Robolectric network fetch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/unit"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name unit-test-results --dir "$RUNNER_TEMP/unit"
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = list((Path(os.environ["RUNNER_TEMP"]) / "unit").rglob("TEST-*.xml"))
          if not reports:
              raise SystemExit("No XML test reports downloaded")
          failures = []
          artist_tests = []
          for file in reports:
              suite = ET.parse(file).getroot()
              for case in suite.iter("testcase"):
                  name = str(case.get("classname", "")) + "." + str(case.get("name", ""))
                  if "ArtistHeroLayoutTest" in name:
                      artist_tests.append(name)
                  for element in list(case.findall("failure")) + list(case.findall("error")):
                      failures.append((name, str(element.get("message", "")) + " " + str(element.text)))
          print("XML suites:", len(reports), "artist layout cases:", len(artist_tests), "failures:", len(failures))
          if len(artist_tests) != 3:
              raise SystemExit("Missing expected three artist layout tests")
          if len(failures) != 1:
              raise SystemExit("Expected exactly one unrelated failure, found " + str(len(failures)))
          name, trace = failures[0]
          if "AudioDurationExtractorTest" not in name or "MavenArtifactFetcher" not in trace or "SocketException" not in trace:
              raise SystemExit("Failure differs from the investigated network-only Robolectric failure: " + name)
          print("Accepted known external Robolectric dependency download error:", name)
          PY
      - name: Download exact CI-generated APK artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v8"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name stash-debug-apk --dir "$RUNNER_TEMP/v8"
          find "$RUNNER_TEMP/v8" -type f -name '*.apk'
      - name: Verify APK identity and signature
        shell: bash
        run: |
          set -euo pipefail
          SRC=$(find "$RUNNER_TEMP/v8" -type f -name '*.apk' | head -n1)
          test -s "$SRC"
          AAPT=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name aapt | sort -V | tail -n1)
          SIGNER=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name apksigner | sort -V | tail -n1)
          test -x "$AAPT"
          test -x "$SIGNER"
          "$AAPT" dump badging "$SRC" | grep '^package: ' | tee "$RUNNER_TEMP/package.txt"
          grep -Fq "name='com.stash.app.debug' versionCode='158' versionName='0.9.122-sonora-artist-v8'" "$RUNNER_TEMP/package.txt"
          "$SIGNER" verify "$SRC"
          cp "$SRC" "$RUNNER_TEMP/Sonora-Artista-V8-v0.9.122.apk"
          sha256sum "$RUNNER_TEMP/Sonora-Artista-V8-v0.9.122.apk"
      - name: Publish immutable V8 prerelease
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::V8 release already exists, refusing to overwrite"
            exit 1
          fi
          APK="$RUNNER_TEMP/Sonora-Artista-V8-v0.9.122.apk"
          test -s "$APK"
          DIGEST=$(sha256sum "$APK" | cut -d' ' -f1)
          cat > "$RUNNER_TEMP/notes.md" <<'EOF'
          ## Sonora — perfil de artista V8 (prévia de teste)

          Construção do perfil de artista com fotografia, wordmark/nome, Play e álbum destacado dentro da mesma composição visual. Região fotográfica responsiva, card mais discreto e destaque de faixa ativa reduzido para 4% apenas no perfil.

          **APK debug**, pacote `com.stash.app.debug`, versionCode **158**, versão **0.9.122-sonora-artist-v8**.

          **Validação:** APK e compilação de todos os testes aprovados no GitHub Actions, incluindo os testes do perfil. A suíte completa executou 1.658 testes e teve **uma falha de infraestrutura** em `core:data / AudioDurationExtractorTest`: Robolectric não conseguiu buscar uma dependência Maven por erro de rede (`SocketException`). Os demais testes passaram. A publicação exige verificação automática dos relatórios XML para confirmar que esta é a única falha. Não é um release estável e não equivale a suíte 100% verde. Pacote e assinatura verificados antes de publicar.

          **Ainda não é aceite visual 1:1:** conferir no Redmi Note 14 hero, enquadramento, card, Play, menus, rolagem, mini-player, álbum e Search. Não há merge na versão estável.

          Se houver incompatibilidade de assinatura com outra Debug, não desinstale o aplicativo sem considerar os dados locais.
          EOF
          printf '\n**APK SHA-256:** `%s`\n**Código-fonte compilado:** `%s`\n**Testes:** https://github.com/%s/actions/runs/%s\n' "$DIGEST" "$SOURCE_COMMIT" "$GITHUB_REPOSITORY" "$SOURCE_RUN_ID" >> "$RUNNER_TEMP/notes.md"
          gh release create "$RELEASE_TAG" "$APK" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_COMMIT" --title 'Sonora Artista V8 — 0.9.122' --notes-file "$RUNNER_TEMP/notes.md" --prerelease --latest=false
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url,assets --jq '{url:.url,assets:[.assets[].name]}'
