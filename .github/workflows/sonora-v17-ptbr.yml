name: Sonora V17 — Brazilian Portuguese and Date Formats

on:
  push:
    branches:
      - feat/sonora-v17-ptbr-dates-copy
    paths:
      - .github/workflows/sonora-v17-ptbr.yml
      - build-logic/settings.gradle.kts
      - app/build.gradle.kts
      - 'feature/**/src/main/**'
      - 'feature/**/src/test/**'
      - 'core/**/src/main/**'
      - 'core/**/src/test/**'
      - feature/search/src/test/**
      - feature/nowplaying/src/main/**
      - core/data/src/main/kotlin/com/stash/core/data/artistphotos/**
      - core/data/src/main/kotlin/com/stash/core/data/musicbrainz/**
      - feature/home/src/main/kotlin/com/stash/feature/home/HomeScreen.kt
      - core/ui/src/main/kotlin/com/stash/core/ui/visual/VisualScreens.kt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-build-release:
    name: Parse tests, Android Debug, signature and Release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout snapshot
        uses: actions/checkout@v6

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test locale, artist photos, features and compile APK
        env:
          FANART_API_KEY: ${{ secrets.FANART_API_KEY }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :core:common:testDebugUnitTest :core:data:testDebugUnitTest :core:ui:testDebugUnitTest :feature:home:testDebugUnitTest :feature:search:testDebugUnitTest :feature:nowplaying:testDebugUnitTest :feature:library:testDebugUnitTest :feature:settings:testDebugUnitTest :feature:sync:testDebugUnitTest :feature:community:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Verify Debug APK package and signing
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name aapt | sort -V | tail -n1)
          SIGNER=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name apksigner | sort -V | tail -n1)
          "$AAPT" dump badging "$APK" | grep '^package:' | tee "$RUNNER_TEMP/package.txt"
          grep -Fq "name='com.stash.app.debug' versionCode='167' versionName='0.9.131-sonora-ptbr'" "$RUNNER_TEMP/package.txt"
          "$SIGNER" verify "$APK"
          sha256sum "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: sonora-v17-ptbr-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish V17 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=sonora-v17-ptbr-20261031
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release already exists; refusing to overwrite it"
            exit 1
          fi
          APK="$RUNNER_TEMP/Sonora-V17-PTBR-v0.9.131-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          # Sonora V17 — Interface e datas em português brasileiro

          APK Debug: `com.stash.app.debug` · versionCode 167 · v0.9.131.

          - Datas exibidas como dd/MM/aaaa e horários relativos em português brasileiro.
          - Capítulos, RSS, notificações e histórico de sincronização usam formatação PT-BR.
          - Traduções para compartilhamento, comunidade, descoberta de álbuns, dispositivos e acessibilidade do mini-player.
          - Mantidos os termos consolidados: download, playlist, mix, streaming, Wi-Fi e nomes próprios.
          - APIs, datas persistidas, nomes de músicas, títulos de álbuns e reprodução não são alterados.
          - Curadoria de fotografias por formação atual (MusicBrainz), captura datada (Wikimedia), categoria/resolução e likes (Fanart), com fallback seguro.
          - Apple priorizada para metadados de capa/ano de álbuns já resolvidos, sem trocar links reproduzíveis.
          - Abas Música/Podcasts/Audiolivros posicionadas junto ao topo seguro; navegação inferior 5 dp mais baixa mantendo alvos e barras de sistema.
          - Mini-player com microcontorno orgânico bilateral limitado a 16 dp atrás da agulha; controles de seek intocados.
          - Apple Music continua fonte primária de logos com os fallbacks existentes.
          - Integra cadeia V15 + V14 + V13 num checkpoint de validação.
          - Aba Audiolivros agora oferece abrir YouTube, copiar prompt, colar resposta, analisar e salvar capítulos.
          - Parsing estrito: horários, sequência sem saltos, sem sobreposição e limites de tamanho.
          - SQLite local, armazenamento por ID de vídeo, recuperação após reinício.
          - Toda resposta é rotulada como **proposta não verificada**; limites estimados não comandam nenhum timer.
          - Sem acesso à API interna do Ask YouTube, Google Account ou download de áudio.
          - Preserva Apple Music como primeira fonte de logos e Play fumê derivado da fotografia.
          - Corrigida tolerância do teste de alpha da V14.

          Ainda NÃO implementa Apple Music como áudio (MusicKit/DRM), Player V8 experimental, reprodução de audiolivros ou timer por capítulo; exige testes reais de UI antes de mesclar.

          Valide em dispositivo real antes de promover.
          EOF
          printf '\nCommit: `%s`\nSHA-256: `%s`\n' "$GITHUB_SHA" "$SHA" >> "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Sonora V17 — Português brasileiro e datas" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --prerelease --latest=false
