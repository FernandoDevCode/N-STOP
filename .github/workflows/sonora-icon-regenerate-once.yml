name: One-time Sonora launcher asset regeneration
on:
  push:
    branches: [fix/sonora-icon-assets-v184]
    paths:
      - .github/workflows/sonora-icon-regenerate-once.yml
      - tools/regenerate_sonora_launcher.py
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Convert indexed PNG and recreate all launcher mipmaps
        run: |
          python -m pip install --quiet Pillow==11.3.0
          python tools/regenerate_sonora_launcher.py
      - name: Commit verified RGBA assets to this temporary branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/drawable-nodpi app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi
          git diff --cached --quiet && { echo "::error::No icons changed"; exit 1; }
          git commit -m "fix(sonora): replace old launcher PNGs with true RGBA"
          git push origin HEAD:fix/sonora-icon-assets-v184
